<!doctype html>
<!-- This declaration tells the browser to use modern HTML rules. -->
<html lang="en">
  <!-- The head contains page information rather than visible weather content. -->
  <head>
    <!-- UTF-8 allows normal letters, symbols, and weather emoji to display correctly. -->
    <meta charset="UTF-8" />
    <!-- The viewport setting makes the layout fit phones, tablets, and computers. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The theme colour can tint supported mobile browser controls. -->
    <meta name="theme-color" content="#12355b" />
    <!-- This title appears on the browser tab and in bookmarks. -->
    <title>Weather Explorer</title>
  </head>
  <!-- The body contains the one empty element that React will control. -->
  <body>
    <!-- React places the complete application inside this root element. -->
    <div id="root"></div>
    <!-- Vite starts the JavaScript application from main.jsx. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
